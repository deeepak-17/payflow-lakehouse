name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests (Spark transforms, reconciliation, mart)
        run: python -m pytest -q tests
      - name: DAG imports cleanly
        run: |
          pip install "apache-airflow==3.1.*"
          AIRFLOW__CORE__DAGS_FOLDER=dags airflow dags list-import-errors
